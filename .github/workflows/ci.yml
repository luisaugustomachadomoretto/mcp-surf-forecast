name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type safety
      - name: Type check
        run: npx tsc --noEmit

      # Tests with coverage
      - name: Run tests
        run: npx vitest run --coverage

#      # MCP compliance — verify all tools, resources, prompts register correctly
#      - name: Inspect MCP server
#        run: npx fastmcp inspect src/server.ts

  security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Semgrep Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Deploy the production "runtime" image to Fly.io.
  # Runs only on pushes to main, after tests and security both pass.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-group  # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Fail fast with a clear message if the deploy token isn't configured,
      # instead of flyctl falling back to an interactive login that errors
      # with a confusing "no access token available" message.
      - name: Check FLY_API_TOKEN is set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN secret is not set. Create a deploy token with 'fly tokens create deploy -x 999999h' and add it under Settings → Secrets and variables → Actions as FLY_API_TOKEN."
            exit 1
          fi

      # Builds the Dockerfile's `runtime` target (per fly.toml) on Fly's
      # remote builders and releases it.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A Fly app only gets a public DNS record once it has a public IP.
      # fly launch/deploy doesn't always allocate one, so ensure it here.
      # Idempotent: only allocates what's missing, so it's safe on every push.
      - name: Ensure public IPs are allocated
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          IPS="$(flyctl ips list 2>/dev/null || true)"
          echo "$IPS"
          if ! echo "$IPS" | grep -qiE '\bv6\b'; then
            echo "Allocating IPv6..."
            flyctl ips allocate-v6 --yes
          else
            echo "IPv6 already allocated."
          fi
          if ! echo "$IPS" | grep -qiE '\bv4\b'; then
            echo "Allocating shared IPv4..."
            flyctl ips allocate-v4 --shared --yes
          else
            echo "IPv4 already allocated."
          fi

      # Surface the public MCP endpoint in the logs and the job summary.
      # The hostname is deterministic (<app>.fly.dev), so we read the app name
      # straight from fly.toml rather than parsing `flyctl status --json`
      # (whose schema differs for Machines-based apps).
      - name: Print deployed URL
        run: |
          APP="$(grep -m1 '^app' fly.toml | cut -d'"' -f2)"
          URL="https://${APP}.fly.dev/mcp"
          echo "Deployed MCP endpoint: ${URL}"
          {
            echo "### 🚀 Deployed to Fly.io"
            echo ""
            echo "MCP endpoint: \`${URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
