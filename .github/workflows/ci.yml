name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type safety
      - name: Type check
        run: npx tsc --noEmit

      # Tests with coverage
      - name: Run tests
        run: npx vitest run --coverage

#      # MCP compliance — verify all tools, resources, prompts register correctly
#      - name: Inspect MCP server
#        run: npx fastmcp inspect src/server.ts

  security:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Semgrep Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/typescript
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Deploy the production "runtime" image to Fly.io.
  # Runs only on pushes to main, after tests and security both pass.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-group  # ensure only one deploy runs at a time
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Builds the Dockerfile's `runtime` target (per fly.toml) on Fly's
      # remote builders and releases it.
      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Surface the public MCP endpoint in the logs and the job summary.
      # The hostname is deterministic (<app>.fly.dev), so we read the app name
      # straight from fly.toml rather than parsing `flyctl status --json`
      # (whose schema differs for Machines-based apps).
      - name: Print deployed URL
        run: |
          APP="$(grep -m1 '^app' fly.toml | cut -d'"' -f2)"
          URL="https://${APP}.fly.dev/mcp"
          echo "Deployed MCP endpoint: ${URL}"
          {
            echo "### 🚀 Deployed to Fly.io"
            echo ""
            echo "MCP endpoint: \`${URL}\`"
          } >> "$GITHUB_STEP_SUMMARY"
