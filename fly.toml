# fly.toml app configuration file generated for mcp-surf-forecast on 2026-10-23T01:24:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mcp-surf-forecast'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '3000'
  TRANSPORT = 'http'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
