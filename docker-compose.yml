services:
  surf-forecast:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp-surf-forecast:latest
    container_name: mcp-surf-forecast
    ports:
      - "3000:3000"
    environment:
      TRANSPORT: http
      PORT: "3000"
      HOST: 0.0.0.0
      LOG_LEVEL: info
    restart: unless-stopped
